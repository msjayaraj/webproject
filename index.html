<!-- Header Section -->

<body>
    <header class="hero-section">
        <div id="hero" class="overlay">
            <h1 id="hero-heading"></h1>
            <a href="#about">
                <img src="images/pic1.jpg" alt="" class="right" width="200" height="200" />
            </a>
            <p id="hero-tagline" style="color:#b71c1c">
                <em></em>
            </p>
            <div id="banner">
                <h2 id="hero-content"></h2>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#poojas">Poojas</a>
        <a href="#festivals">Festivals</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
        <button class="link-like" onclick="callAPI()">Sign In</button>
    </nav>

    <section id="about" class="page-section about-bg">
        <div class="content-card">
            <h2 id="about-heading"> </h2>
            <p id="about-content"> </p>
            <p id="about-tagline"> </p>
            </div>
    </section>

    <!-- Daily Poojas -->
    <section id="poojas" class="page-section pooja-bg ">
        <div class="content-card">
            <h2>🪔 പ്രതിദിന പൂജകൾ</h2>
            <div id="poojaDiv" class="pooja-grid"></div>
        </div>
    </section>

    <!-- Festivals Section -->
    <section id="festivals" class="page-section festival-bg">
        <div class="content-card">
            <h2 id="festivals-title">🎉 ഉത്സവങ്ങൾ</h2>

            <div id="item_list" class="festival-grid">
                <!-- JS will inject items here -->
            </div>
        </div>
    </section>

    <section id="gallery" class="page-section gallery-bg">
        <div class="content-card">
            <h2>📸 ഫോട്ടോ ഗ്യാലറി</h2>

            <div class="modern-gallery">
                <figure class="gallery-item">
                    <img src="images/temple_front2.png" alt="Temple Entrance" onclick="openModal(this)">
                    <figcaption>ക്ഷേത്ര പ്രവേശനം</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/devi_idol.png" alt="Devi Idol" onclick="openModal(this)">
                    <figcaption>ഭഗവതി വിഗ്രഹം</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/Temple_Pond.png" alt="Temple Pond" onclick="openModal(this)">
                    <figcaption>ക്ഷേത്ര കുളം</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/festival.png" alt="Festival Celebration" onclick="openModal(this)">
                    <figcaption>ഉത്സവ ആഘോഷങ്ങൾ</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/temple_festival2.png" alt="Temple Festival" onclick="openModal(this)">
                    <figcaption>കൂട്ടി എഴുന്നള്ളിപ്പ്  </figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="images/Night_View.png" alt="Temple Festival" onclick="openModal(this)">
                    <figcaption>ദീപാലങ്കാരം  </figcaption>
                </figure>
            </div>
        </div>
    </section>
    
  

    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="fullImage">
    </div>

    <!-- Contact Section -->
    <section id="contact" class="section contact-section">
        <h2 id="contact-title"></h2>
    </section>

        <p>© 2025 Kuttiyankavu Bhagavathy Temple | Managed by Temple Trust</p>
