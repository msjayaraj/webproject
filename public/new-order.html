<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Purchase Order CRUD</title>
    <link rel="stylesheet" href="/css/new-order.css">
</head>
<body>

    <h2>Online Pooja Booking</h2>

    <form id="poForm">
        <input type="hidden" id="orderId">

        <label>Name of Pooja</label>
        <input type="text" id="pooja-name" required>

        <label>Name</label>
        <input type="text" id="name" required>

        <label>Address</label>
        <input type="text" id="address">

        <label>Star</label>
        <input type="text" id="star" required>

        <label>Date</label>
        <input type="text" id="date">

        <label>Quantity</label>
        <input type="number" id="quantity" required>

        <label>Price</label>
        <input type="number" id="price" required>

        <button type="submit">Save</button>
    </form>

    <h2>All Purchase Orders</h2>

    <table>
        <thead>
            <tr>
                <th>Pooja ID</th>
                <th>Pooja Name</th>
                <th>Address</th>
                <th>Star</th>
                <th>Date</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="orderTable"></tbody>
    </table>

    <script>
    let orders = JSON.parse(localStorage.getItem("purchaseOrders")) || [];

    const form = document.getElementById("poForm");
    const table = document.getElementById("orderTable");

    function renderOrders() {
        table.innerHTML = "";
        orders.forEach((order, index) => {
            table.innerHTML += `
                <tr>
                    <td>${order.id}</td>
                    <td>${order.pooja_name}</td>
                    <td>${order.address}</td>
                    <td>${order.star}</td>
                    <td>${order.date}</td>
                    <td>${order.quantity}</td>
                    <td>${order.price}</td>
                    <td>${order.quantity * order.price}</td>
                    <td>
                        <button class="edit-btn" onclick="editOrder(${index})">Edit</button>
                        <button class="delete-btn" onclick="deleteOrder(${index})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const id = document.getElementById("orderId").value;
        const pooja_name = document.getElementById("pooja-name").value;
        const name = document.getElementById("name").value;
        const address = document.getElementById("address").value;
        const star = document.getElementById("star").value;
        const date = document.getElementById("date").value;
        const quantity = document.getElementById("quantity").value;
        const price = document.getElementById("price").value;

        if (id !== "") {
            orders[id] = { id: orders[id].id, pooja_name, name, address, star,date,quantity, price };
        } else {
            orders.push({
                id: "PO-" + Date.now(),
                pooja_name,
                name,
                address,
                star,
                date,
                quantity,
                price
            });
        }

        localStorage.setItem("purchaseOrders", JSON.stringify(orders));
        form.reset();
        document.getElementById("orderId").value = "";
        renderOrders();
    });

    function editOrder(index) {
        const order = orders[index];
        document.getElementById("orderId").value = index;
        document.getElementById("pooja-name").value = order.pooja_name;
        document.getElementById("address").value = order.address;
        document.getElementById("star").value = order.star;
        document.getElementById("date").value = order.date;
        document.getElementById("quantity").value = order.quantity;
        document.getElementById("price").value = order.price;
    }

    function deleteOrder(index) {
        if (confirm("Are you sure you want to delete this order?")) {
            orders.splice(index, 1);
            localStorage.setItem("purchaseOrders", JSON.stringify(orders));
            renderOrders();
        }
    }

    renderOrders();
    </script>

</body>
</html>
